services:
  # Backend API
  - type: web
    name: social-network-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend Static Site
  - type: static
    name: social-network-frontend
    rootDir: frontend
    buildCommand: ""
    publishDir: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
