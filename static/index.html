<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SocialNet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-screen" class="screen">
  <div class="card">
    <h1>🌐 SocialNet</h1>
    <div class="tabs">
      <button class="tab active" data-tab="login">Вход</button>
      <button class="tab" data-tab="register">Регистрация</button>
    </div>
    <div id="login-form" class="tab-content active">
      <input id="login-username" placeholder="Логин">
      <input id="login-password" type="password" placeholder="Пароль">
      <button onclick="doLogin()">Войти</button>
    </div>
    <div id="register-form" class="tab-content">
      <input id="reg-username" placeholder="Логин">
      <input id="reg-password" type="password" placeholder="Пароль">
      <button onclick="doRegister()">Зарегистрироваться</button>
    </div>
    <div id="auth-message" class="message"></div>
  </div>
</div>

<div id="app-screen" class="screen hidden">
  <header>
    <h2>🌐 SocialNet</h2>
    <div class="user-info">
      <span id="current-username"></span>
      <button onclick="doLogout()">Выйти</button>
    </div>
  </header>

  <nav>
    <button class="nav-btn active" data-page="feed">📰 Лента</button>
    <button class="nav-btn" data-page="my-posts">📝 Мои посты</button>
    <button class="nav-btn" data-page="friends">👥 Друзья</button>
    <button class="nav-btn" data-page="messages">✉️ Сообщения</button>
    <button class="nav-btn" data-page="profile">👤 Профиль</button>
  </nav>

  <main id="content"></main>
</div>

<script src="app.js"></script>
</body>
</html>
