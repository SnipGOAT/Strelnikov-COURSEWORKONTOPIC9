{% extends "layout.html" %}
{% block content %}
<h2>Друзья</h2>
<form action="/friends/add" method="post" class="add-friend-form">
    <input type="text" name="username" placeholder="Логин друга" required>
    <button type="submit" class="btn btn-primary">Добавить</button>
</form>

<div class="friend-list">
{% for friend in friends %}
    <div class="friend-card-wrapper">
        <a href="/messages?contact={{ friend.id }}" class="friend-card-link">
            <div class="friend-card">
                <div class="friend-avatar">{{ friend.username[0] }}</div>
                <div class="friend-name">{{ friend.username }}</div>
            </div>
        </a>
        <form action="/friends/remove/{{ friend.id }}" method="post" class="remove-friend-form">
            <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
        </form>
    </div>
{% else %}
    <p class="no-friends">Список друзей пуст.</p>
{% endfor %}
</div>
{% endblock %}
