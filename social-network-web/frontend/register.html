<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — MAX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>MAX</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="login.html">Войти</a>
            <button class="theme-toggle" onclick="toggleTheme()">Смена темы</button>
        </nav>
    </header>

    <main>
        <form id="register-form" class="auth-form">
            <h2 style="text-align:center; margin-bottom:20px;">Создать аккаунт</h2>
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" placeholder="Придумайте логин" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Минимум 8 символов" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Подтвердите пароль</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Повторите пароль" required>
            </div>
            <button type="submit" class="btn btn-accent" style="width:100%">Зарегистрироваться</button>
            <div id="error-message" class="error" style="display:none;"></div>
            <div id="success-message" class="success" style="display:none;">Регистрация прошла успешно!</div>
            <p style="text-align:center; margin-top:16px; color:var(--text-secondary);">
                Уже есть аккаунт? <a href="login.html">Войдите</a>
            </p>
        </form>
    </main>

    <footer>© 2026 MAX</footer>

    <script src="js/app.js"></script>
    <script>
        function toggleTheme() {
            document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
        }
    </script>
</body>
</html>
