{% extends "layout.html" %}
{% block content %}
<div class="chat-wrapper" id="chatWrapper">
    <div class="chat-sidebar" id="chatSidebar">
        <div class="sidebar-header">💬 Чаты</div>
        <div id="contacts-list" class="contacts-list">
            <!-- Контакты загрузятся через JS -->
        </div>
    </div>
    <div class="chat-main" id="chatMain">
        <div class="chat-header" id="chat-header">
            <button class="mobile-back-btn" id="mobileBackBtn">←</button>
            <span id="chatHeaderTitle">Выберите чат</span>
        </div>
        <div class="messages-container" id="messages-box">
            <!-- Сообщения -->
        </div>
        <div id="attachment-preview" class="attachment-preview-area" style="display: none;">
            <div class="attachment-preview-content">
                <img id="attachment-preview-img" src="" alt="preview" class="attachment-preview-img">
                <span id="attachment-preview-name" class="attachment-preview-name"></span>
                <button id="attachment-remove-btn" class="attachment-remove-btn" title="Удалить файл">✕</button>
            </div>
        </div>
        <div class="chat-input-area" id="chat-input-area" style="display: none;">
            <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off">
            <label for="attachment-input" class="file-attach-label" id="file-label">📎</label>
            <input type="file" id="attachment-input" style="display: none;">
            <button id="send-button">➤</button>
        </div>
    </div>
</div>
{% endblock %}
