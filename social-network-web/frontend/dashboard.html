<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - Социальная сеть</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👤 Профиль</h1>
            <nav>
                <span id="user-name"></span>
                <button onclick="logout()">Выйти</button>
            </nav>
        </header>

        <main>
            <div class="tabs">
                <button class="tab-btn active" data-tab="profile">Профиль</button>
                <button class="tab-btn" data-tab="friends">Друзья</button>
                <button class="tab-btn" data-tab="posts">Публикации</button>
                <button class="tab-btn" data-tab="feed">Лента</button>
                <button class="tab-btn" data-tab="messages">Сообщения</button>
            </div>

            <!-- Профиль -->
            <section id="profile" class="tab-content active">
                <div class="profile-info">
                    <h2>Мой профиль</h2>
                    <p><strong>ID:</strong> <span id="profile-id"></span></p>
                    <p><strong>Логин:</strong> <span id="profile-username"></span></p>
                    <p><strong>Друзей:</strong> <span id="profile-friends-count"></span></p>
                    <p><strong>Публикаций:</strong> <span id="profile-posts-count"></span></p>
                </div>
                <div class="password-change">
                    <h3>Сменить пароль</h3>
                    <form id="password-form">
                        <input type="password" id="old-password" placeholder="Старый пароль" required>
                        <input type="password" id="new-password" placeholder="Новый пароль" required>
                        <button type="submit" class="btn btn-primary">Изменить</button>
                    </form>
                </div>
            </section>

            <!-- Друзья -->
            <section id="friends" class="tab-content">
                <h2>Друзья</h2>
                <div class="add-friend">
                    <input type="text" id="friend-username" placeholder="Логин друга">
                    <button onclick="addFriend()" class="btn btn-primary">Добавить</button>
                </div>
                <div id="friends-list"></div>
            </section>

            <!-- Публикации -->
            <section id="posts" class="tab-content">
                <h2>Мои публикации</h2>
                <div class="create-post">
                    <textarea id="post-text" placeholder="Что у вас нового?" rows="3"></textarea>
                    <button onclick="createPost()" class="btn btn-primary">Опубликовать</button>
                </div>
                <div id="posts-list"></div>
            </section>

            <!-- Лента -->
            <section id="feed" class="tab-content">
                <h2>Лента новостей</h2>
                <div id="feed-list"></div>
            </section>

            <!-- Сообщения -->
            <section id="messages" class="tab-content">
                <h2>Сообщения</h2>
                <div class="send-message">
                    <input type="text" id="message-receiver" placeholder="ID получателя">
                    <textarea id="message-text" placeholder="Текст сообщения" rows="2"></textarea>
                    <button onclick="sendMessage()" class="btn btn-primary">Отправить</button>
                </div>
                <div class="message-tabs">
                    <button onclick="showInbox()" class="btn">Входящие</button>
                    <button onclick="showOutbox()" class="btn">Исходящие</button>
                </div>
                <div id="messages-list"></div>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
