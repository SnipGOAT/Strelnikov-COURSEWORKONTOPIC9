<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — MAX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>MAX</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="register.html">Регистрация</a>
            <button class="theme-toggle" onclick="toggleTheme()">Смена темы</button>
        </nav>
    </header>

    <main>
        <form id="login-form" class="auth-form">
            <h2 style="text-align:center; margin-bottom:20px;">Вход в аккаунт</h2>
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Войти</button>
            <div id="error-message" class="error" style="display:none;"></div>
            <div id="success-message" class="success" style="display:none;">Успешный вход!</div>
            <p style="text-align:center; margin-top:16px; color:var(--text-secondary);">
                Нет аккаунта? <a href="register.html">Зарегистрируйтесь</a>
            </p>
        </form>
    </main>

    <footer>© 2026 MAX</footer>

    <script src="js/app.js"></script>
    <script>
        // Функция переключения темы (можно вынести в app.js при необходимости)
        function toggleTheme() {
            const body = document.body;
            body.dataset.theme = body.dataset.theme === 'dark' ? 'light' : 'dark';
        }
    </script>
</body>
</html>
