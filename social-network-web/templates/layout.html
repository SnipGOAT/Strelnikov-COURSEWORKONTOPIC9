<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Social Network</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo"><i class="fas fa-users"></i> SocialNet</a>
            <div class="nav-links">
                <a href="/"><i class="fas fa-home"></i> Главная</a>
                <a href="/friends"><i class="fas fa-user-friends"></i> Друзья</a>
                <a href="/messages"><i class="fas fa-envelope"></i> Сообщения</a>
                <a href="/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Выйти</a>
            </div>
        </div>
    </nav>
    <main class="main-container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>© 2026 MAX</p>
    </footer>
</body>
</html>
