<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MAX 2.0</title>

    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icon-192.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SocialNet">
    <meta name="theme-color" content="#4facfe">

    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            {% if user %}
                <div class="nav-left">
                    <a href="/posts"><i class="fas fa-newspaper"></i> Публикации</a>
                    <a href="/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Выйти</a>
                </div>
                <a href="/" class="logo">MAX 2.0</a>
                <div class="nav-right">
                    <a href="/friends"><i class="fas fa-user-friends"></i> Друзья</a>
                    <a href="/messages">
                        <i class="fas fa-envelope"></i> Сообщения
                        {% if unread_count > 0 %}
                            <span class="badge">{{ unread_count }}</span>
                        {% endif %}
                    </a>
                </div>
            {% else %}
                <a href="/" class="logo">MAX 2.0</a>
                <div class="nav-right">
                    <a href="/login"><i class="fas fa-sign-in-alt"></i> Войти</a>
                    <a href="/register"><i class="fas fa-user-plus"></i> Регистрация</a>
                </div>
            {% endif %}
        </div>
    </nav>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 MAX 2.0</p>
    </footer>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js')
          .then(reg => console.log('SW зарегистрирован', reg.scope))
          .catch(err => console.log('Ошибка SW', err));
      }
    </script>

    <script>
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
      });
    </script>

    {% if user %}
    <script src="/static/chat.js"></script>
    {% endif %}
</body>
</html>
