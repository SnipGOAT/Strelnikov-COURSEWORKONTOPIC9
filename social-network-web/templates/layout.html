<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MAX</title>
    <link rel="stylesheet" href="/static/style.css?v=6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            {% if user %}
                <div class="nav-left">
                    <a href="/posts"><i class="fas fa-newspaper"></i> Публикации</a>
                    <a href="/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Выйти</a>
                </div>
                <a href="/" class="logo">MAX</a>
                <div class="nav-right">
                    <a href="/friends"><i class="fas fa-user-friends"></i> Друзья</a>
                    <a href="/messages">
                        <i class="fas fa-envelope"></i> Сообщения
                        {% if unread_count > 0 %}
                            <span class="badge">{{ unread_count }}</span>
                        {% endif %}
                    </a>
                </div>
            {% else %}
                <a href="/" class="logo">MAX</a>
                <div class="nav-right">
                    <a href="/login"><i class="fas fa-sign-in-alt"></i> Войти</a>
                    <a href="/register"><i class="fas fa-user-plus"></i> Регистрация</a>
                </div>
            {% endif %}
        </div>
    </nav>
    <main class="main-container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>© 2026 MAX</p>
    </footer>
</body>
</html>
